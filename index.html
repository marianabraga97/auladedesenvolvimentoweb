<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Descubra a Palavra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
      <h1>Jogo "Descubra a Palavra"</h1>
      <a href="index.html" class="btn btn-primary">Cadastrar Palavras</a>
      <a href="lista.html" class="btn btn-success">Listar Palavras</a>
      <a href="jogo.html" class="btn btn-danger">Iniciar Jogo</a>
      <h2 class="mt-3">Cadastrar Palavras</h2>

      <form>
        <p>
          <label for="inPalavra">Palavra</label>
          <input type="text" class="form-control" id="inPalavra" required autofocus>
        </p>
        <p>
          <label for="inDica">Dica da Palavra</label>
          <input type="text" class="form-control" id="inDica" required>
        </p>
        <input type="submit" class="btn btn-primary" value="Cadastrar">
      </form>
    </div>
    <script src="./js/script.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</html>
