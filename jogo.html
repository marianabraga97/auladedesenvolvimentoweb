<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Descubra a Palavra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .corFundo {
            background-color: rgb(189, 225, 247);
        }
    </style>
    </head>
  <body>
    <div class="container">
      <h1>Jogo "Descubra a Palavra"</h1>
      <a href="index.html" class="btn btn-primary">Cadastrar Palavras</a>
      <a href="lista.html" class="btn btn-success">Listar Palavras</a>
      <a href="jogo.html" class="btn btn-danger">Iniciar Jogo</a>

      
<form id="frmJogo">

    <div class="row mt-3 py-2 corFundo align-items-center">

        <div class="col-sm-4">
            <label for="inLetra" class="form-label"> Informe uma Letra: </label>
        </div>

        <div class="col-sm-2">
            <input
                type="text"
                class="form-control"
                id="inLetra"
                maxlength="1"
                required
                autofocus
                autocomplete="off"
            >
        </div>

        <div class="col-sm-6">
            <input
                type="submit"
                class="btn btn-primary"
                value="Jogar"
                id="btJogar"
            >
        </div>

    </div>

    <div class="row mt-3">

        <div class="col-sm-8">

            <h2>
                Palavra:
                <span id="outPalavra" class="text-primary"></span>
            </h2>

            <h2>
                Nro de Chances:
                <span id="outChances" class="text-danger">4</span>
            </h2>

            <h2>
                Erros:
                <span id="outErros" class="text-danger"></span>
            </h2>

            <h2 id="outMensagemFinal"></h2>

        </div>

        <div class="col-sm-4">

            <h3>Situação Jogador:</h3>

            <img
                src="./img/status4.jpg"
                alt="Situação do jogador"
                class="img-fluid"
                id="imgStatus"
            >

        </div>

    </div>

    <div class="row corFundo p-3 mt-3">

        <div class="col-sm-12">

            <input
                type="button"
                value="Ver Dica"
                class="btn btn-primary"
                id="btVerDica"
            >

            <span id="outDica">*Custo: 1 Chance</span>

        </div>

    </div>

</form>
    
    </div>

    <script src="./js/jogo.js"></script>
    

        <script src="./js/script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
